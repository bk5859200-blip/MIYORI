<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1517" />
      <stop offset="50%" stop-color="#132326" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.75)" />
    </radialGradient>
  </defs>
  
  <!-- Base Background -->
  <rect width="400" height="400" fill="#040808"/>
  <rect width="400" height="400" fill="url(#g1)" opacity="0.35"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
  </g>
  
  <!-- Main Visual Graphic -->
  
            <rect x="100" y="100" width="200" height="200" rx="100" fill="none" stroke="#14b8a6" stroke-width="2"/>
            <rect x="140" y="140" width="120" height="120" rx="60" fill="url(#g1)" opacity="0.4"/>
            <rect x="180" y="180" width="40" height="40" rx="20" fill="#2dd4bf"/>
        
  
  <!-- Vignette Overlay -->
  <rect width="400" height="400" fill="url(#vignette)"/>
  
  <!-- Badge &amp; Meta -->
  <rect x="24" y="24" width="70" height="22" rx="4" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)"/>
  <text x="59" y="39" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" font-weight="700" fill="#14b8a6" text-anchor="middle" letter-spacing="1">DUB TECHNO</text>
  
  <text x="376" y="38" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="end" letter-spacing="2">320 KBPS</text>
  
  <!-- Typography at bottom -->
  <rect x="0" y="300" width="400" height="100" fill="linear-gradient(to top, rgba(0,0,0,0.9), transparent)"/>
  <text x="24" y="352" font-family="'Space Grotesk', system-ui, sans-serif" font-size="17" font-weight="700" fill="#f8fafc" letter-spacing="-0.02em">SUBTERRANEAN</text>
  <text x="24" y="374" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.65)">Deep Chord</text>
  <circle cx="365" cy="360" r="12" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <polygon points="362,354 371,360 362,366" fill="#fff"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261c16" />
      <stop offset="50%" stop-color="#3d2b21" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.75)" />
    </radialGradient>
  </defs>
  
  <!-- Base Background -->
  <rect width="400" height="400" fill="#120e0b"/>
  <rect width="400" height="400" fill="url(#g1)" opacity="0.35"/>
  
  <!-- Subtle Grid Lines -->

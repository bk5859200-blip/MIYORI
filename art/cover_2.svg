<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1118" />
      <stop offset="50%" stop-color="#1c202c" />
      <stop offset="100%" stop-color="#d8dce5" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.75)" />
    </radialGradient>
  </defs>
  
  <!-- Base Background -->
  <rect width="400" height="400" fill="#050608"/>
  <rect width="400" height="400" fill="url(#g1)" opacity="0.35"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
  </g>
  
  <!-- Main Visual Graphic -->
  
            <rect x="90" y="90" width="220" height="220" rx="24" fill="none" stroke="#d8dce5" stroke-width="2" opacity="0.4" transform="rotate(45 200 200)"/>
            <rect x="120" y="120" width="160" height="160" rx="16" fill="url(#g1)" opacity="0.3" transform="rotate(45 200 200)"/>
            <line x1="60" y1="200" x2="340" y2="200" stroke="#f5f6f8" stroke-width="1.5" opacity="0.7"/>
            <circle cx="200" cy="200" r="8" fill="#d8dce5"/>
        
  
  <!-- Vignette Overlay -->
  <rect width="400" height="400" fill="url(#vignette)"/>
  
  <!-- Badge &amp; Meta -->
  <rect x="24" y="24" width="70" height="22" rx="4" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)"/>
  <text x="59" y="39" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" font-weight="700" fill="#d8dce5" text-anchor="middle" letter-spacing="1">DARK TECHNO</text>
  
  <text x="376" y="38" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="end" letter-spacing="2">320 KBPS</text>
  
  <!-- Typography at bottom -->
  <rect x="0" y="300" width="400" height="100" fill="linear-gradient(to top, rgba(0,0,0,0.9), transparent)"/>
  <text x="24" y="352" font-family="'Space Grotesk', system-ui, sans-serif" font-size="17" font-weight="700" fill="#f8fafc" letter-spacing="-0.02em">OBSIDIAN DRIFT</text>
  <text x="24" y="374" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.65)">Miyori Audio Labs</text>
  <circle cx="365" cy="360" r="12" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <polygon points="362,354 371,360 362,366" fill="#fff"/>
</svg>